<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 388" width="860" height="388"><style>
text{font-family:Helvetica,Arial,sans-serif;fill:#52514e}
.title{font-size:16px;font-weight:600;fill:#0b0b0b}.sub{font-size:11.5px}
.tick,.tlabel,.legend{font-size:11px}.axis{font-size:12px}
.grid{stroke:#e6e5e1;stroke-width:1}.zero{stroke:#8a8984;stroke-width:1}
.band{fill:#b6d3f7}
.median{fill:none;stroke:#1c5cab;stroke-width:2}
.theory{fill:none;stroke:#52514e;stroke-width:1.25;stroke-dasharray:5 4}
.row{font-size:12px;fill:#0b0b0b}.ask{font-size:12.5px;fill:#0b0b0b}</style><rect width="860" height="388" fill="#ffffff"/><text class="title" x="20" y="24">Count-Min point-query error, DataSketches&#x27; setup</text><text class="ask" x="20" y="45">How far above the true count is one point query, and how often does it pass the bound εN?</text><text class="sub" x="20" y="66">w = 272, d = 3: ε = e/w = 0.0100, δ = e^−d = 0.050. One stream of N = 2^16 items, Zipf(0.7) over 1024 keys. 8192 trials; each</text><text class="sub" x="20" y="81">trial renames every key, which re-draws every hash position. Error = estimate − true count of the most frequent key.</text><line class="grid" x1="300.0" x2="300.0" y1="108" y2="292"/><text class="tick" x="300.0" y="308" text-anchor="middle">0</text><line class="grid" x1="364.5" x2="364.5" y1="108" y2="292"/><text class="tick" x="364.5" y="308" text-anchor="middle">200</text><line class="grid" x1="428.9" x2="428.9" y1="108" y2="292"/><text class="tick" x="428.9" y="308" text-anchor="middle">400</text><line class="grid" x1="493.4" x2="493.4" y1="108" y2="292"/><text class="tick" x="493.4" y="308" text-anchor="middle">600</text><line class="grid" x1="557.8" x2="557.8" y1="108" y2="292"/><text class="tick" x="557.8" y="308" text-anchor="middle">800</text><line class="grid" x1="622.3" x2="622.3" y1="108" y2="292"/><text class="tick" x="622.3" y="308" text-anchor="middle">1000</text><line class="grid" x1="686.7" x2="686.7" y1="108" y2="292"/><text class="tick" x="686.7" y="308" text-anchor="middle">1200</text><text class="axis" x="505" y="328" text-anchor="middle">error of one point query (counts above the true count)</text><text class="axis" x="722" y="102">95% within</text><text class="axis" x="800" y="102">past εN</text><text class="row" x="288" y="132.0" text-anchor="end">asap_sketchlib Count-Min, fast path</text><text class="tick" x="288" y="146.0" text-anchor="end">sketch-bench cms-fastpath-vector2d / lib</text><line x1="373.8" x2="679.6" y1="131.0" y2="131.0" stroke="#8a8984" stroke-width="1.25"/><circle cx="679.6" cy="131.0" r="3" fill="#8a8984"/><rect class="band1" x="300.0" y="122.0" width="73.8" height="18" rx="2"/><line x1="327.7" x2="327.7" y1="118.0" y2="144.0" stroke="#0b0b0b" stroke-width="2.5"/><text class="row" x="722" y="135.0">229</text><text class="row" x="800" y="135.0">0.02%</text><text class="row" x="288" y="178.0" text-anchor="end">asap_sketchlib Count-Min, regular path</text><text class="tick" x="288" y="192.0" text-anchor="end">sketch-bench cms-regularpath-vector2d / lib</text><line x1="371.5" x2="605.2" y1="177.0" y2="177.0" stroke="#8a8984" stroke-width="1.25"/><circle cx="605.2" cy="177.0" r="3" fill="#8a8984"/><rect class="band1" x="300.0" y="168.0" width="71.5" height="18" rx="2"/><line x1="327.1" x2="327.1" y1="164.0" y2="190.0" stroke="#0b0b0b" stroke-width="2.5"/><text class="row" x="722" y="181.0">222</text><text class="row" x="800" y="181.0">0.02%</text><text class="row" x="288" y="224.0" text-anchor="end">DataSketches Count-Min, same trials</text><text class="tick" x="288" y="238.0" text-anchor="end">sketch-bench cms / datasketches</text><line x1="370.6" x2="494.6" y1="223.0" y2="223.0" stroke="#8a8984" stroke-width="1.25"/><circle cx="494.6" cy="223.0" r="3" fill="#8a8984"/><rect class="band1" x="300.0" y="214.0" width="70.6" height="18" rx="2"/><line x1="326.7" x2="326.7" y1="210.0" y2="236.0" stroke="#0b0b0b" stroke-width="2.5"/><text class="row" x="722" y="227.0">219</text><text class="row" x="800" y="227.0">0.00%</text><text class="row" x="288" y="270.0" text-anchor="end">DataSketches characterization, published</text><text class="tick" x="288" y="284.0" text-anchor="end">its own stream; median of its 1024 items</text><line x1="371.2" x2="443.7" y1="269.0" y2="269.0" stroke="#8a8984" stroke-width="1.25"/><circle cx="443.7" cy="269.0" r="3" fill="#8a8984"/><rect class="band1" x="300.0" y="260.0" width="71.2" height="18" rx="2"/><line x1="327.1" x2="327.1" y1="256.0" y2="282.0" stroke="#0b0b0b" stroke-width="2.5"/><text class="row" x="722" y="273.0">221</text><text class="row" x="800" y="273.0">—</text><line class="theory" x1="511.1" x2="511.1" y1="104" y2="292"/><text class="tlabel" x="507.1" y="102" text-anchor="end">bound εN = 655</text><rect class="band1" x="20" y="343" width="18" height="10" rx="2"/><text class="legend" x="44" y="352">95% of trials are within the bar</text><line x1="250.2" x2="250.2" y1="341" y2="353" stroke="#0b0b0b" stroke-width="2.5"/><text class="legend" x="265.2" y="352">median</text><line x1="316.79999999999995" x2="331.79999999999995" y1="348" y2="348" stroke="#8a8984" stroke-width="1.25"/><circle cx="331.79999999999995" cy="348" r="3" fill="#8a8984"/><text class="legend" x="340.79999999999995" y="352">largest single trial</text><text class="sub" x="20" y="376">Theory: at most δ = 5% of queries land past the dashed line, so every bar must end left of it.</text></svg>